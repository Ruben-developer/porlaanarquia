<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Por la Anarquía</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; }
        header { border-bottom: 2px solid #ff0000; padding: 2rem; text-align: center; background: linear-gradient(180deg, #1a0000 0%, #000 100%); }
        h1 { color: #ff0000; text-transform: uppercase; letter-spacing: 4px; font-size: 2.5rem; }
        main { max-width: 900px; margin: 0 auto; padding: 3rem 1rem; text-align: center; }
        p { color: #ccc; margin-top: 1rem; }
    </style>
</head>
<body>
    <header>
        <h1>Por la Anarquía</h1>
    </header>
    <main>
        <h2>En construcción</h2>

    </main>

</html>
