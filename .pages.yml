# Configuración de Pages CMS (https://pagescms.org)
# Se lee desde la raíz del repo. Cada entrada edita un archivo de datos.
# Las imágenes se suben a assets/; los PDFs de MAREA van aparte, a R2.

media:
  input: assets
  output: assets
  rename: safe
  categories: [image]

content:
  - name: portada
    label: Portada
    type: file
    path: datos/portada.json
    format: json
    fields:
      - name: imagen
        label: Imagen de portada
        type: image
        required: true
        description: "El grabado de la cabecera. Se sube a assets/; conviene que sea ancha (1600×412)."
      - name: alt
        label: Descripción de la imagen
        type: text
        required: true
        description: "Qué se ve, para quien usa lector de pantalla."

  - name: noticias
    label: Noticias
    type: file
    path: datos/noticias.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: categoria
        label: Categoría
        type: string
        required: true
        description: "Escríbela libremente (Cultura, Solidaridad, Trabajo…). Los filtros se generan solos con las categorías que existan en las notas: no hay lista que mantener ni código que tocar."
      - name: fecha
        label: Fecha
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: lugar
        label: Ciudad o lugar
        type: string
        required: true
      - name: bajada
        label: Bajada (opcional)
        type: text
        description: "Una o dos frases que resumen la nota. Puede quedar vacía."
      - name: cuerpo
        label: Cuerpo (opcional)
        type: rich-text
        options:
          format: markdown
          media: false
        description: "Admite negrita, cursiva, listas, citas y enlaces. Puede quedar vacío si la nota es solo un afiche con imagen."
      - name: imagen
        label: Imagen (opcional)
        type: image
        description: "Se sube a assets/ y aparece al abrir la nota. Si falta, la nota va solo con texto."
      - name: id
        label: Identificador (opcional)
        type: string
        description: "Déjalo vacío: se genera solo con la fecha y el título."

  - name: recortes
    label: Lecturas
    type: file
    path: datos/recortes.json
    format: json
    list: true
    fields:
      - name: tipo
        label: Tipo
        type: select
        required: true
        options:
          values:
            - Extracto
            - Frase
            - Historia
        description: "Extracto de un libro o artículo, una frase célebre o una historia anarquista breve."
      - name: titulo
        label: Título
        type: string
        required: true
      - name: texto
        label: Texto
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
        description: "La entrada: la frase, el extracto o el primer párrafo de la historia. Admite negrita, cursiva y enlaces. En la lista se muestra este primer párrafo."
      - name: cuerpo
        label: Resto de la historia (opcional)
        type: rich-text
        options:
          format: markdown
          media: false
        description: "Continúa el texto. Se lee al abrir «Leer completo», después del primer párrafo. Admite negrita, cursiva, listas, citas y enlaces."
      - name: autor
        label: Autoría
        type: string
        description: "Quién lo escribió o de quién se trata. Opcional."
      - name: fuente
        label: Fuente
        type: string
        description: "Libro, año o lugar. Opcional."
      - name: id
        label: Identificador (opcional)
        type: string
        description: "Déjalo vacío: se genera solo con el tipo y el título."

  - name: agenda
    label: Agenda
    type: file
    path: datos/agenda.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Actividad
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: hora
        label: Hora
        type: string
        required: true
        description: "Formato 24 h, por ejemplo 19:30."
      - name: lugar
        label: Lugar
        type: string
        required: true
      - name: ciudad
        label: Ciudad
        type: string
        required: true
      - name: descripcion
        label: Descripción (opcional)
        type: rich-text
        options:
          format: markdown
          media: false
        description: "Se muestra al abrir «Leer más», nunca en la lista. Admite negrita, cursiva, listas, citas y enlaces."
      - name: afiche
        label: Afiche (opcional)
        type: image
        description: "Se muestra solo dentro de «Leer más», nunca en la lista. Se sube a assets/."
      - name: id
        label: Identificador (opcional)
        type: string
        description: "Déjalo vacío: se genera solo con la fecha y el título."

  - name: efemerides
    label: Efemérides
    type: file
    path: datos/efemerides.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Qué se conmemora
        type: string
        required: true
      - name: dia
        label: Día
        type: number
        required: true
      - name: mes
        label: Mes (1 a 12)
        type: number
        required: true
      - name: anio
        label: Año del hecho
        type: number
        required: true
      - name: texto
        label: Glosa
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
      - name: detalle
        label: Detalle (opcional)
        type: rich-text
        options:
          format: markdown
          media: false
        description: "Se muestra al abrir «Leer más». Admite negrita, cursiva, listas, citas y enlaces."
      - name: imagen
        label: Imagen (opcional)
        type: image
        description: "Se muestra solo dentro de «Leer más», nunca en la lista. Se sube a assets/."

  - name: comunicados
    label: Comunicados
    type: file
    path: datos/comunicados.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: texto
        label: Texto
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
      - name: id
        label: Identificador (opcional)
        type: string
        description: "Déjalo vacío: se genera solo con la fecha y el título."
